# Alembic configuration.
#
# NOTE: The connection string is intentionally NOT stored here.
# migrations/env.py builds it from DATABASE_MIGRATOR_URL (a role with BYPASSRLS).
# Putting it here would commit credentials to the repository.
#
# This file is ASCII-only on purpose: configparser reads it with the locale
# encoding, so non-ASCII comments break on Windows (cp932). Japanese
# explanations live in migrations/env.py, which Python reads as UTF-8.

[alembic]
script_location = migrations
prepend_sys_path = .
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
timezone = Asia/Tokyo

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
